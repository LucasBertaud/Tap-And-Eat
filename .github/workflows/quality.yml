name: Code Quality

on:
    pull_request:
        branches: [main, develop]

jobs:
    quality:
        name: Code Quality Checks
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 🔧 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: 📦 Install dependencies
              run: npm ci

            - name: 📝 Check commit messages
              run: |
                  git log --format=%s origin/${{ github.base_ref }}..${{ github.sha }} | \
                  grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+" || \
                  echo "⚠️  Warning: Commit messages should follow conventional commits format"

            - name: 📊 Check bundle size
              run: npx expo export --platform android --output-dir dist
              env:
                  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
                  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

            - name: 📏 Analyze bundle size
              run: |
                  BUNDLE_SIZE=$(du -sh dist | cut -f1)
                  echo "📦 Bundle size: $BUNDLE_SIZE"
                  echo "bundle_size=$BUNDLE_SIZE" >> $GITHUB_OUTPUT

            - name: 💬 Comment PR
              uses: actions/github-script@v7
              if: github.event_name == 'pull_request'
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `## 📊 Code Quality Report\n\n✅ All quality checks passed!\n\n**Bundle Size:** ${{ steps.bundle_size.outputs.bundle_size }}`
                      })
